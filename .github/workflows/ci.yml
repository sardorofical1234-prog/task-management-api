name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Build, test and smoke-test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate Postman collection and environment JSON
        run: |
          python -m json.tool "postman/Task Management API.postman_collection.json" > /dev/null
          python -m json.tool "postman/Local.postman_environment.json" > /dev/null

      - name: Start API and PostgreSQL with Docker Compose
        run: docker compose -p task-management-ci up --build --detach

      - name: Wait for API and database readiness
        shell: bash
        run: |
          for attempt in {1..36}; do
            if response="$(curl --fail --silent http://localhost:8080/actuator/health/readiness)" \
              && echo "$response" | python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") == "UP" else 1)'; then
              echo "API readiness is UP (including PostgreSQL connectivity)."
              exit 0
            fi

            echo "Waiting for API readiness (attempt $attempt/36)..."
            sleep 5
          done

          echo "API did not become ready within 180 seconds."
          docker compose -p task-management-ci logs --no-color
          exit 1

      - name: Verify Swagger and protected API behavior
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            http://localhost:8080/swagger-ui.html --output /dev/null

          status_code="$(curl --silent --output /dev/null --write-out "%{http_code}" \
            http://localhost:8080/api/v1/tasks)"

          if [ "$status_code" != "401" ]; then
            echo "Expected unauthenticated task request to return 401, got $status_code."
            exit 1
          fi

          echo "Swagger is reachable and protected task API rejects unauthenticated requests."

      - name: Show Docker Compose logs on failure
        if: failure()
        run: docker compose -p task-management-ci logs --no-color || true

      - name: Stop Docker Compose services
        if: always()
        run: docker compose -p task-management-ci down --volumes --remove-orphans
