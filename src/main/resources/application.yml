server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/task_management}
    username: ${DB_USERNAME:task_user}
    password: ${DB_PASSWORD:task_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  security:
    jwt:
      issuer: task-management-api
      # Development-only fallback. Set JWT_SECRET_BASE64 to a private random key in deployed environments.
      secret-base64: ${JWT_SECRET_BASE64:VGhlLXNlY3JldC1rZXktZm9yLWxvY2FsLWRldmVsb3BtZW50LW9ubHktY2hhbmdlLW1l}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
