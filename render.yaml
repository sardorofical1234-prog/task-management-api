services:
  - type: web
    name: task-management-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "10000"
      - key: DB_HOST
        fromDatabase:
          name: task-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: task-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: task-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: task-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: task-management-db
          property: password
      - key: JWT_SECRET_BASE64
        generateValue: true
      - key: JWT_ACCESS_TOKEN_TTL
        value: PT15M

databases:
  - name: task-management-db
    databaseName: task_management
    user: task_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
